<div class="container">
    <h1 class="title">GESTION PROFILS</h1>
    <div class="search-bar">
        <input type="text" placeholder="Profil" class="search-input">
    </div>
    <div class="profile-card">
        <div class="profile-info">
            <img src="./images/avatar.png" alt="Avatar" class="avatar">
            <div class="details">
                <h2 class="username">PSEUDO 1</h2>
                <p class="role"><span class="status-dot"></span> ADMINISTRATEUR</p>
            </div>
        </div>
        <div class="profile-actions">
            <div class="action">
                <label for="droit">DROIT :</label>
                <select id="droit" class="dropdown">
                    <option value="niveau1">NIVEAU 1</option>
                    <option value="niveau2">NIVEAU 2</option>
                    <option value="niveau3">NIVEAU 3</option>
                </select>
            </div>
            <div class="action">
                <label for="role">ROLE :</label>
                <button class="add-button" id="add-role-btn">+ AJOUTER</button>
            </div>
        </div>
    </div>
</div>

   <!-- Popup -->
   <div id="popup" class="hidden">
    <div class="popup-content">
        <h2>Attribuer un rôle</h2>
        <p>Veuillez choisir un rôle parmi les options suivantes :</p>
        <form id="role-form">
            <select id="role-select">
                <option value="visiteur">Visiteur</option>
                <option value="membre">Membre</option>
                <option value="administrateur">Administrateur</option>
            </select>
            <div class="popup-actions">
                <button type="button" id="cancel-popup">Annuler</button>
                <button type="submit" id="validate-role">Valider</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js"></script>
